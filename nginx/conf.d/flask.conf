upstream flask_backend {
    server flask-app:5000;
}

server {
    listen 80;
    server_name joaocerca.eu www.joaocerca.eu;

    return 301 https://$server_name$request_uri;


    # Static files (CSS, JS, images)
    location /static {
        alias /var/www/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        alias /var/www/static/favicon/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Main application
    location / {
        proxy_pass http://flask-app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increased timeouts for Bokeh dashboards
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://flask_backend;
    }

    # Logging
    access_log /var/log/nginx/flask_access.log;
    error_log /var/log/nginx/flask_error.log;
}

# HTTPS configuration (uncomment and configure when you have SSL certificates)
server {
    listen 443 ssl http2;
    server_name joaocerca.eu www.joaocerca.eu;

    # SSL Certificate files (update these filenames to match yours)
    ssl_certificate /etc/nginx/ssl/joaocerca_ssl_cert.cer;
    ssl_certificate_key /etc/nginx/ssl/joaocerca_priv.key;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100M;
    client_body_timeout 120s;

    # Logging
    access_log /var/log/nginx/https_access.log;
    error_log /var/log/nginx/https_error.log;

    # Static files
    location /static {
        alias /var/www/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        alias /var/www/static/favicon/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Main application
    location / {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

